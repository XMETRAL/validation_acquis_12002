{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Connexion</h1>
  <p class="muted">Espace d'administration des questionnaires.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus autocomplete="username">
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <label class="inline-check"><input type="checkbox" name="remember"> Rester connecté</label>
    <div class="btn-row" style="margin-top:1.2rem">
      <button class="btn btn-primary btn-lg" type="submit">Se connecter</button>
      <a href="{{ url_for('auth.forgot_password') }}">Mot de passe oublié ?</a>
    </div>
  </form>
</div>
{% endblock %}
