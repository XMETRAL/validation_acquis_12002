{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Mot de passe oublié</h1>
  <p class="muted">Saisissez votre email pour recevoir un lien de réinitialisation.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
    <div class="btn-row" style="margin-top:1.2rem">
      <button class="btn btn-primary" type="submit">Générer le lien</button>
      <a href="{{ url_for('auth.login') }}">Retour à la connexion</a>
    </div>
  </form>
</div>
{% endblock %}
